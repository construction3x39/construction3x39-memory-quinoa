# 🔐 GPG Client Configuration for Sacred Technology Development
# Professional cryptographic settings for consciousness-serving code
# construction3x39-memory-gnupg-config

# === CRYPTOGRAPHIC PREFERENCES ===

# Use strong digest algorithms
personal-digest-preferences SHA512 SHA384 SHA256
cert-digest-algo SHA512
default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES CAST5 ZLIB BZIP2 ZIP Uncompressed

# Modern cipher preferences (favor AES)
personal-cipher-preferences AES256 AES192 AES CAST5
personal-compress-preferences ZLIB BZIP2 ZIP Uncompressed

# Strong key generation defaults
default-key-algo rsa4096
default-sig-expire 2y
default-cert-expire 2y

# === DISPLAY & OUTPUT ===

# Clean, professional output
fixed-list-mode
with-fingerprint
with-keyid-format 0xlong
list-options show-uid-validity
verify-options show-uid-validity

# Verbose output for transparency
verbose

# Show key validity
trust-model tofu+pgp

# === KEYSERVER CONFIGURATION ===

# Use reliable keyservers
keyserver hkps://keys.openpgp.org
keyserver-options auto-key-retrieve
keyserver-options honor-keyserver-url
keyserver-options include-revoked

# === SECURITY HARDENING ===

# Don't leak version information
no-version
no-comments

# Disable weak algorithms
disable-cipher-algo 3DES
disable-cipher-algo CAST5
disable-cipher-algo BLOWFISH
weak-digest SHA1

# Cross-certify signatures
require-cross-certification

# === BEHAVIOR SETTINGS ===

# Don't automatically retrieve keys
# auto-key-retrieve

# Ask before importing keys
# auto-key-import

# Use agent for key operations
use-agent

# === ARMOR & ENCODING ===

# Always use ASCII armor for text output
armor

# === PHOTO ID SETTINGS ===

# Don't show photo IDs by default
no-show-photos

# === COMPLIANCE & STANDARDS ===

# RFC4880bis compliance
rfc4880bis

# === SACRED TECHNOLOGY NOTES ===

# This configuration prioritizes:
# 1. Strong cryptography for long-term security
# 2. Professional output suitable for development workflows  
# 3. Privacy protection without sacrificing functionality
# 4. Compatibility with modern GPG standards
# 5. Transparency and auditability

