# 🔐 GPG Directory Manager Configuration for Sacred Technology
# Network and keyserver settings for professional GPG workflows
# construction3x39-memory-gnupg-config

# === KEYSERVER CONFIGURATION ===

# Primary keyserver (modern, privacy-respecting)
keyserver hkps://keys.openpgp.org

# Fallback keyservers for reliability
# keyserver hkps://keyserver.ubuntu.com
# keyserver hkps://pgp.mit.edu

# === NETWORK SETTINGS ===

# Honor keyserver URL preferences in keys
honor-http-proxy

# Use standard HTTP User-Agent
standard-resolver

# === CERTIFICATE VALIDATION ===

# Use system certificate store
hkp-cacert /etc/ssl/certs/ca-certificates.crt

# === PRIVACY & SECURITY ===

# Don't send detailed version information
no-greeting

# Use DNS SRV records for keyserver discovery
use-dns-srv

# === CACHING & PERFORMANCE ===

# Cache CRL for performance
max-cache-ttl 86400

# === PROXY CONFIGURATION ===

# Uncomment and configure if using Tor for privacy
# tor-mode
# nameserver 127.0.0.1:53

# Uncomment for HTTP proxy
# http-proxy proxy.example.com:8080

# Uncomment for SOCKS proxy  
# socks-proxy 127.0.0.1:9050

# === DEBUGGING (uncomment for troubleshooting) ===

# verbose
# debug-level basic
# log-file /tmp/dirmngr.log

# === SACRED TECHNOLOGY NOTES ===

# This configuration balances:
# 1. Reliable key discovery and validation
# 2. Privacy protection during network operations
# 3. Performance optimization for development workflows
# 4. Security best practices for keyserver interactions
# 5. Compatibility across different network environments

# For enhanced privacy, consider using Tor by uncommenting tor-mode
# For corporate environments, configure proxy settings as needed

